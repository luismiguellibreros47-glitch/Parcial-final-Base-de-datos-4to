info:
  name: "19 Anular venta"
  type: http
  seq: 19

http:
  method: PUT
  url: "http://localhost:5001/api/ventas/{{venta_anular}}/anular"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Respuesta esperada 200.
