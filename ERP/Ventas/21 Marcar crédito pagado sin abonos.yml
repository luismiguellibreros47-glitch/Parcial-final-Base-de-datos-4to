info:
  name: "21 Marcar crédito pagado sin abonos"
  type: http
  seq: 21

http:
  method: PUT
  url: "http://localhost:5001/api/ventas/{{venta_credito}}/estado"
  body:
    type: json
    data: |-
      {
        "estado_venta": "Pagado"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.sqlstate
      operator: eq
      value: "45000"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Respuesta esperada 400. Ejecuta antes del último abono.
