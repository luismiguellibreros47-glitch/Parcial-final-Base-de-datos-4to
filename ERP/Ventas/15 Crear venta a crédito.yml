info:
  name: "15 Crear venta a crédito"
  type: http
  seq: 15

http:
  method: POST
  url: "http://localhost:5001/api/ventas/"
  body:
    type: json
    data: |-
      {
        "id_tercero": 19,
        "estado_venta": "Por Pagar",
        "detalles": [
          {
            "id_producto": 16,
            "cantidad": 2,
            "precioUnitario": 45000,
            "porcentaje_iva": 0.19
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body?.id_venta) bru.setVar("venta_credito", res.body.id_venta);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Respuesta esperada 201.
