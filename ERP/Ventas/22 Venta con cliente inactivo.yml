info:
  name: "22 Venta con cliente inactivo"
  type: http
  seq: 22

http:
  method: POST
  url: "http://localhost:5001/api/ventas/"
  body:
    type: json
    data: |-
      {
        "id_tercero": "{{tercero_prueba}}",
        "estado_venta": "Pendiente",
        "detalles": [
          {
            "id_producto": 16,
            "cantidad": 1,
            "precioUnitario": 45000,
            "porcentaje_iva": 0.19
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.sqlstate
      operator: eq
      value: "45000"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Respuesta esperada 400. Ejecuta primero Crear tercero de prueba e Inactivar tercero de prueba.
