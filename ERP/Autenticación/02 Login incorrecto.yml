info:
  name: "02 Login incorrecto"
  type: http
  seq: 2

http:
  method: POST
  url: "http://localhost:5001/api/auth/login"
  body:
    type: json
    data: |-
      {
        "correo": "admin@erp.local",
        "password": "clave-incorrecta"
