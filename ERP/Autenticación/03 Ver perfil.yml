info:
  name: "03 Ver perfil"
  type: http
  seq: 3

http:
  method: GET
  url: "http://localhost:5001/api/auth/perfil"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Respuesta esperada 200.
