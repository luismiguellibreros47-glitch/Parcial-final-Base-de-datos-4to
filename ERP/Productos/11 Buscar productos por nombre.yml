info:
  name: "11 Buscar productos por nombre"
  type: http
  seq: 11

http:
  method: GET
  url: "http://localhost:5001/api/productos/?nombre=Cable"
  params:
    - name: nombre
      value: "Cable"
      type: query
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Respuesta esperada 200. Con la base activa, este filtro permite observar el stock del producto 16 antes y después de anular la venta.
