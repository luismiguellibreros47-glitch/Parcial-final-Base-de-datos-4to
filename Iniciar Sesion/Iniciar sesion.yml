info:
  name: Iniciar sesion
  type: http

http:
  method: POST
  url: http://localhost:5001/api/auth/login
  body:
    type: json
    data: |-
      {
        "correo": "admin@erp.local",
        "password": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
